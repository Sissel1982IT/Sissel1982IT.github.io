<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Klasse 07/2026 - Discord Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1c1e;
            color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }  
        .card {
            background-color: #2b2d31;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #3f4248;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        p {
            color: #b5bac1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #5865F2; /* Discord Blau */
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #4752C4;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>IT-Klasse 07/2026</h1>
        <p>Willkommen im zentralen Speicherort für unsere Umschulung. Hier findest du alle Lernfelder, den Materialaustausch und den Live-Countdown bis zu den Ferien!</p>
        <!-- HIER DEINEN DISCORD-LINK EINTRAGEN -->
        <a href="https://discord.gg/JqA3VRnNaQ" target="_blank" class="btn">Server beitreten</a>
    </div>

</body>
</html>
