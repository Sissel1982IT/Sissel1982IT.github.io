
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Netzwerk-Prüfungs-Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <main class="max-w-2xl mx-auto bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-2">Netzwerk-Prüfungs-Coach</h1>
        <div id="status-panel" class="mb-6 p-4 bg-slate-900 border border-slate-600 rounded-xl">
            <p id="source-indicator" class="text-amber-400 font-medium">Status: Bereit. Bitte ZIP-Diskette oder JSON einlegen.</p>
        </div>

        <input type="file" id="file-input" accept=".json,.zip" class="w-full text-sm text-slate-400 border border-slate-700 rounded-xl bg-slate-700 p-3 mb-6">

        <div id="quiz-container" class="hidden space-y-6">
            <!-- Fortschritt -->
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <h2 id="q-text" class="text-xl font-semibold leading-relaxed">Frage...</h2>
            <div id="options-box" class="grid gap-3"></div>
            
            <div id="feedback-box" class="hidden p-4 rounded-xl border"></div>
            <button id="next-btn" class="hidden w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition">Nächste Frage</button>
        </div>
    </main>

    <script>
        window.questions = [];
        window.currentIdx = 0;
        window.score = 0;

        window.renderQuestion = function() {
            const q = window.questions[window.currentIdx];
            document.getElementById('q-text').innerText = q.question;
            
            const progress = ((window.currentIdx + 1) / window.questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            q.options.forEach((opt, i) => {
                box.innerHTML += `<button onclick="window.check(${i})" class="p-4 bg-slate-700 hover:bg-slate-600 rounded-xl text-left border border-slate-600 transition">${opt}</button>`;
            });
            document.getElementById('next-btn').classList.add('hidden');
        };

        window.check = function(i) {
            const q = window.questions[window.currentIdx];
            const feedback = document.getElementById('feedback-box');
            feedback.classList.remove('hidden');
            
            if (i === q.correctAnswer) {
                feedback.className = "p-4 rounded-xl border border-emerald-500/50 bg-emerald-900/20 text-emerald-300";
                feedback.innerText = "Richtig! " + q.explanation;
                window.score++;
            } else {
                feedback.className = "p-4 rounded-xl border border-rose-500/50 bg-rose-900/20 text-rose-300";
                feedback.innerText = "Falsch! Richtig war: " + q.options[q.correctAnswer];
            }
            document.getElementById('next-btn').classList.remove('hidden');
        };

        document.getElementById('next-btn').onclick = () => {
            window.currentIdx++;
            if (window.currentIdx < window.questions.length) {
                window.renderQuestion();
                document.getElementById('feedback-box').classList.add('hidden');
            } else {
                alert("Quiz beendet! Score: " + window.score);
                window.location.reload();
            }
        };

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                let data = event.target.result;
                if (file.name.endsWith('.zip')) {
                    const zip = await JSZip.loadAsync(data);
                    for (const name in zip.files) {
                        if (name.endsWith('.json')) {
                            data = await zip.files[name].async("string");
                            break;
                        }
                    }
                }
                window.questions = JSON.parse(data);
                document.getElementById('source-indicator').innerText = `Diskette aktiv! ${window.questions.length} Fragen geladen.`;
                document.getElementById('source-indicator').className = "text-emerald-400 font-bold";
                document.getElementById('quiz-container').classList.remove('hidden');
                window.renderQuestion();
            };
            file.name.endsWith('.zip') ? reader.readAsArrayBuffer(file) : reader.readAsText(file);
        });
    </script>
</body>
</html>
