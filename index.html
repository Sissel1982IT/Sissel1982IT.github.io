<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktives Quiz mit Retro-Laufwerk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=VT323&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .linear-timer { transition: width 1s linear; }

        .retro-mode { background-color: #008080 !important; color: #000000 !important; font-family: 'Courier New', Courier, monospace !important; }
        .retro-mode #quiz-card, .retro-mode header, .retro-mode footer { background-color: #c0c0c0 !important; border: 3px double #ffffff !important; box-shadow: inset -1.5px -1.5px #0a0a0a, inset 1.5px 1.5px #dfdfdf, 1.5px 1.5px #0a0a0a, -1.5px -1.5px #dfdfdf !important; border-radius: 0px !important; }
        .retro-mode button { background-color: #c0c0c0 !important; color: #000000 !important; border: 2px solid !important; border-color: #ffffff #808080 #808080 #ffffff !important; font-weight: bold !important; }
        .retro-mode .bg-slate-900 { background-color: #ffffff !important; border: 2px solid #808080 !important; }
        .retro-mode #visual-container { background-color: #051405 !important; border: 4px solid #808080 !important; }
        
        #floppy-disk { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; }
        .floppy-inserted { transform: translateY(110px) scale(0.7) rotateX(15deg); opacity: 0.15; }
        @keyframes led-blink { 0% { background-color: #4ade80; } 100% { background-color: #166534; } }
        .led-active { animation: led-blink 0.2s infinite alternate; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">IT-Prüfungsvorbereitung</h1>
            <button onclick="setTheme(currentTheme === 'modern' ? 'retro' : 'modern')" class="bg-blue-600 px-3 py-1 rounded text-xs">Theme-Wechsel</button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div id="quiz-card" class="max-w-2xl w-full bg-slate-800 rounded-2xl p-8 shadow-xl border border-slate-700">
            <!-- START SCREEN -->
            <div id="start-screen" class="text-center space-y-6">
                <h2 class="text-2xl font-bold">Bereit für den Topologie-Check?</h2>
                <button onclick="startQuiz()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold">Quiz starten</button>
            </div>
            <!-- QUIZ SCREEN -->
            <div id="quiz-screen" class="hidden space-y-4">
                <h3 id="question-text" class="text-lg">Frage lädt...</h3>
                <div id="options-container" class="space-y-2"></div>
                <button id="action-btn" onclick="checkAnswer()" class="bg-blue-600 px-4 py-2 rounded">Antwort prüfen</button>
            </div>
        </div>
    </main>

    <script>
        const defaultQuestions = [{ question: "Was ist ein Switch?", options: ["Kabel", "Koppler", "Router", "OSI-Layer 1"], correctAnswer: 1, explanation: "Ein Switch koppelt Geräte." }];
        let questions = [...defaultQuestions], currentQuestionIndex = 0, score = 0, currentTheme = 'modern';

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.question;
            const cont = document.getElementById('options-container');
            cont.innerHTML = '';
            q.options.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "block w-full p-2 bg-slate-700 rounded";
                b.innerText = o;
                b.onclick = () => { /* Logik für Auswahl */ };
                cont.appendChild(b);
            });
        }

        function setTheme(t) {
            currentTheme = t;
            if (t === 'retro') document.body.classList.add('retro-mode');
            else document.body.classList.remove('retro-mode');
        }
    </script>
</body>
</html>
