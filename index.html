<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wissens-Quiz für 5. Klässler</title>
    <!-- CSS-FRAMEWORK & RETRO-FONTS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZIP ZUM DIREKTEN ZIP-ENTPACKEN IM BROWSER-ARBEITSSPEICHER -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=VT323&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .linear-timer {
            transition: width 1s linear;
        }

        .retro-mode {
            background-color: #008080 !important; 
            color: #000000 !important;
            font-family: 'Courier New', Courier, monospace !important;
        }

        .retro-mode #quiz-card, 
        .retro-mode header,
        .retro-mode footer {
            background-color: #c0c0c0 !important;
            border: 3px double #ffffff !important;
            box-shadow: inset -1.5px -1.5px #0a0a0a, inset 1.5px 1.5px #dfdfdf, 1.5px 1.5px #0a0a0a, -1.5px -1.5px #dfdfdf !important;
            color: #000000 !important;
            border-radius: 0px !important;
        }

        .retro-mode header { border-bottom: 3px solid #808080 !important; }

        .retro-mode button, 
        .retro-mode select {
            background-color: #c0c0c0 !important;
            color: #000000 !important;
            border-radius: 0px !important;
            border: 2px solid !important;
            border-color: #ffffff #808080 #808080 #ffffff !important;
            font-weight: bold !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .retro-mode button:active:not(:disabled) {
            border-color: #808080 #ffffff #ffffff #808080 !important;
        }

        .retro-mode button:disabled {
            color: #808080 !important;
            border-color: #ffffff #808080 #808080 #ffffff !important;
            cursor: not-allowed !important;
        }

        .retro-mode #visual-container {
            background-color: #051405 !important;
            border: 4px solid #808080 !important;
            box-shadow: inset 3px 3px #000000 !important;
        }

        #floppy-disk { transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; }
        .floppy-inserted { transform: translateY(110px) scale(0.7) rotateX(15deg); opacity: 0.15; pointer-events: none; }
        
        .led-active { animation: led-blink 0.2s infinite alternate; }
        @keyframes led-blink {
            0% { background-color: #4ade80; box-shadow: 0 0 2px #4ade80; }
            100% { background-color: #166534; box-shadow: 0 0 8px #22c55e; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md transition-all duration-300">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white font-bold">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">Schüler-Quiz</h1>
                    <p class="text-xs text-slate-400">Allgemeinwissen 5. Klasse</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-700 overflow-hidden" id="theme-selectors">
                    <button onclick="setTheme('modern')" id="theme-btn-modern" class="px-3 py-1 text-xs font-semibold rounded bg-blue-600 text-white transition">Modern</button>
                    <button onclick="setTheme('retro')" id="theme-btn-retro" class="px-3 py-1 text-xs font-semibold rounded text-slate-400 hover:text-slate-200 transition">Retro 95</button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/80 overflow-hidden" id="quiz-card">
            
            <!-- START SCREEN -->
            <div id="start-screen" class="p-8 text-center space-y-6">
                <h2 class="text-2xl font-bold text-white">Bist du fit für die 5. Klasse?</h2>
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 text-left space-y-2 max-w-md mx-auto text-xs text-slate-400">
                    <p>Teste dein Wissen in Geografie, Natur und Geschichte.</p>
                </div>
                <button id="btn-start" onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3.5 rounded-xl transition">Quiz starten <i class="fas fa-arrow-right ml-2"></i></button>
            </div>

            <!-- QUIZ SCREEN -->
            <div id="quiz-screen" class="hidden p-6 md:p-8 space-y-6">
                <div class="flex justify-between items-center text-sm text-slate-400">
                    <span>Frage <strong id="current-question-num" class="text-white">1</strong> von <span id="total-questions-num">10</span></span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 10%"></div>
                </div>

                <div id="visual-container" class="w-full bg-slate-900/60 rounded-xl border border-slate-750 p-4 min-h-[100px] flex justify-center items-center">
                    <i class="fas fa-question text-4xl text-slate-600"></i>
                </div>

                <h3 id="question-text" class="text-lg font-semibold text-white"></h3>
                <div id="options-container" class="space-y-3"></div>
                <div id="explanation-box" class="hidden p-4 rounded-xl border">
                    <h4 id="explanation-title" class="font-semibold text-sm"></h4>
                    <p id="explanation-text" class="text-sm mt-1 text-slate-300"></p>
                </div>
                <button id="action-btn" onclick="checkAnswer()" disabled class="w-full bg-blue-600 disabled:bg-slate-700 text-white font-semibold px-6 py-3 rounded-xl transition">Antwort prüfen</button>
            </div>

            <!-- RESULT SCREEN -->
            <div id="result-screen" class="hidden p-8 text-center space-y-6">
                <h2 class="text-2xl font-bold text-white">Ergebnis</h2>
                <span class="block text-3xl font-extrabold text-white" id="final-score"></span>
                <button onclick="restartQuiz()" class="bg-blue-600 text-white px-6 py-3 rounded-xl">Neustart</button>
            </div>
        </div>
    </main>

    <script>
        const defaultQuestions = [
            { "question": "Welcher Planet ist der Sonne am nächsten?", "options": ["Erde", "Mars", "Merkur", "Venus"], "correctAnswer": 2, "explanation": "Merkur ist der sonnennächste Planet." },
            { "question": "Wie heißt die Hauptstadt von Deutschland?", "options": ["München", "Hamburg", "Berlin", "Köln"], "correctAnswer": 2, "explanation": "Berlin ist die Hauptstadt." },
            { "question": "Was ist das größte Säugetier der Welt?", "options": ["Elefant", "Blauwal", "Giraffe", "Nashorn"], "correctAnswer": 1, "explanation": "Der Blauwal ist das größte Tier." },
            { "question": "Welches Bundesland ist das größte in Deutschland?", "options": ["Bayern", "Hessen", "Sachsen", "Berlin"], "correctAnswer": 0, "explanation": "Bayern hat die größte Fläche." },
            { "question": "Wie viele Kontinente gibt es auf der Erde?", "options": ["5", "6", "7", "8"], "correctAnswer": 2, "explanation": "Es gibt meist 7 Kontinente." },
            { "question": "Aus welchem Land kommen die Pyramiden?", "options": ["Griechenland", "Ägypten", "Italien", "Türkei"], "correctAnswer": 1, "explanation": "Die ägyptischen Pyramiden sind weltberühmt." },
            { "question": "Was atmen Pflanzen aus?", "options": ["Sauerstoff", "Kohlendioxid", "Stickstoff", "Helium"], "correctAnswer": 0, "explanation": "Pflanzen produzieren Sauerstoff." },
            { "question": "Welches Insekt produziert Honig?", "options": ["Fliege", "Biene", "Wespe", "Ameise"], "correctAnswer": 1, "explanation": "Bienen sammeln Nektar für Honig." }
        ];

        let questions = [...defaultQuestions];
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswerChecked = false;
        let currentTheme = 'modern';

        function setTheme(theme) {
            currentTheme = theme;
            document.body.classList.toggle('retro-mode', theme === 'retro');
        }

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            quizQuestions = [...questions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            isAnswerChecked = false;
            const q = quizQuestions[currentQuestionIndex];
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('total-questions-num').innerText = quizQuestions.length;
            document.getElementById('question-text').innerText = q.question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 border border-slate-700 bg-slate-800 rounded-xl hover:bg-slate-700";
                btn.innerText = opt;
                btn.onclick = () => { selectedOptionIndex = idx; document.getElementById('action-btn').disabled = false; };
                container.appendChild(btn);
            });
            document.getElementById('action-btn').disabled = true;
            document.getElementById('explanation-box').classList.add('hidden');
        }

        function checkAnswer() {
            isAnswerChecked = true;
            const q = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedOptionIndex === q.correctAnswer;
            if (isCorrect) score++;
            
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('explanation-title').innerText = isCorrect ? "Richtig!" : "Falsch!";
            document.getElementById('explanation-text').innerText = q.explanation;
            
            const btn = document.getElementById('action-btn');
            btn.innerText = currentQuestionIndex < quizQuestions.length - 1 ? "Nächste Frage" : "Auswertung";
            btn.onclick = () => currentQuestionIndex < quizQuestions.length - 1 ? nextQuestion() : showResults();
        }

        function nextQuestion() { currentQuestionIndex++; loadQuestion(); }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} von ${quizQuestions.length} Punkten`;
        }

        function restartQuiz() { location.reload(); }
    </script>
</body>
</html>
